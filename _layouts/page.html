---
layout: default
---
<article class="page">
  <header class="page-header">
    <div class="container">
      {%- if page.kicker -%}
        <p class="kicker">{{ page.kicker }}</p>
      {%- endif -%}
      <h1>{{ page.title | escape }}</h1>
      {%- if page.summary -%}
        <p class="page-header__intro">{{ page.summary }}</p>
      {%- endif -%}
    </div>
  </header>

  <div class="page-body">
    <div class="container">
      {{ content }}
    </div>
  </div>
</article>
