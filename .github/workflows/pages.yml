name: Build and deploy site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No bundler-cache here: the gems are installed explicitly in the next
      # step, so the install output is visible and nothing depends on the
      # action's own gem-path handling. vendor/ and .bundle/ are gitignored,
      # so each runner resolves its own platform's gems.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Report Ruby environment
        run: |
          echo "ruby:    $(ruby -v)"
          echo "bundler: $(bundle -v)"
          echo "--- bundle config ---"
          bundle config
          echo "--- bundle check ---"
          bundle check || echo "::warning::bundle check reports an incomplete bundle"
          echo "--- jekyll loadable? ---"
          bundle exec ruby -e "require 'jekyll'; puts 'jekyll ' + Jekyll::VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tooling
        run: |
          python -m pip install --upgrade pip
          pip install Pillow PyYAML

      - name: Generate responsive images
        run: python scripts/build_images.py

      - name: Build dataset catalog
        run: python scripts/build_datasets.py

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
