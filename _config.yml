title: Dolly Andriatsiferana
tagline: Geography, maps and open data
description: >-
  Geographer specializing in GIS, web mapping and data visualization with
  open-source geospatial technologies.
url: "https://privatemajory.github.io"
baseurl: ""
lang: en
author: Dolly Andriatsiferana
email: andriatsiferana@protonmail.com

# Social / SEO
twitter:
  username: privatemajory
  card: summary_large_image
logo: /assets/images/og-default.jpg
social:
  name: Dolly Andriatsiferana
  links:
    - https://x.com/privatemajory
    - https://www.reddit.com/user/privatemajory/
    - https://www.linkedin.com/in/dolly-andriatsiferana/
    - https://www.openstreetmap.org/user/Privatemajory

# Build settings
markdown: kramdown
highlighter: rouge
timezone: Indian/Antananarivo

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  projects:
    output: true
    permalink: /projects/:slug/
  datasets:
    output: true
    permalink: /datasets/:slug/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

show_excerpts: true

# Keep source assets out of the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - .bundle
  - .editorconfig
  - .gitignore
  - .jekyll-cache
  - .vscode
  - vendor
  - scripts
  - gallery_content
