<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1416" media="(prefers-color-scheme: dark)">

  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      } catch (error) {
        root.dataset.theme = 'light';
      }
      root.classList.add('js');
    })();
  </script>

  {%- seo -%}

  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

  <link rel="preload" href="{{ '/assets/fonts/satoshi-variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/fraunces-variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
