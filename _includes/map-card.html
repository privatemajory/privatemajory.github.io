{%- assign map = include.map -%}
{%- assign size = site.data.map_sizes[map.slug] -%}
{%- assign cat = site.data.map_categories | where: "slug", map.category | first -%}
{%- assign img_sizes = include.sizes | default: "(min-width: 1050px) 31vw, (min-width: 620px) 46vw, 92vw" -%}
<figure class="map-card" id="{{ map.slug }}" data-map-item data-category="{{ map.category }}">
  <a class="map-card__link"
     href="{{ '/assets/images/maps/' | append: map.slug | append: '-' | append: size.width | append: '.webp' | relative_url }}"
     data-lightbox
     data-full="{{ '/assets/images/maps/' | append: map.slug | append: '-' | append: size.width | append: '.webp' | relative_url }}"
     data-title="{{ map.title | escape }}"
     data-caption="{{ map.note | escape }}"
     data-alt="{{ map.title | append: ', ' | append: map.note | escape }}">
    <div class="map-card__media">
      <picture>
        <source type="image/webp"
                srcset="{% for width in size.widths %}{{ '/assets/images/maps/' | append: map.slug | append: '-' | append: width | append: '.webp' | relative_url }} {{ width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
                sizes="{{ img_sizes }}">
        <img src="{{ '/assets/images/maps/' | append: map.slug | append: '-640.jpg' | relative_url }}"
             alt=""
             width="{{ size.width }}"
             height="{{ size.height }}"
             loading="{{ include.loading | default: 'lazy' }}"
             decoding="async"{% if include.priority %} fetchpriority="high"{% endif %}>
      </picture>
      {%- if include.badge and cat -%}
        <span class="map-card__badge">{{ cat.label }}</span>
      {%- endif -%}
    </div>
    <figcaption class="map-card__caption">
      <span class="map-card__title">{{ map.title }}{% if map.note %} <span class="muted">· {{ map.note }}</span>{% endif %}</span>
      <span class="map-card__meta">{{ cat.label }}</span>
    </figcaption>
  </a>
</figure>
